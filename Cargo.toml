[package]
name = "fmutex"
version = "0.3.0"
authors = ["Ross MacArthur <ross@macarthur.io>"]
edition = "2018"
rust-version = "1.66.0"
description = "Cross-platform mutual exclusion across processes on a file or path"
readme = "README.md"
repository = "https://github.com/rossmacarthur/fmutex"
license = "MIT OR Apache-2.0"
keywords = ["raii", "file", "lock", "mutex", "flock"]
categories = ["concurrency", "filesystem"]
include = ["src/**/*", "LICENSE-*", "README.md"]

[target.'cfg(unix)'.dependencies]
libc = "0.2.117"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
temp-dir = "0.1.11"
